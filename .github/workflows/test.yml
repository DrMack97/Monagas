# Tests en cada push/PR.
#
# Historial real: nunca pasó, en ninguna de sus ejecuciones — mismo bug
# que build.yml (pnpm no se instalaba). Corregido con pnpm/action-setup.
#
# firebase/functions tenía además su propio bug (jest.config.js roto,
# copiado de una app de React con testEnvironment:'jsdom' y un
# setupTests.ts que nunca existió) y CERO tests reales (4 archivos con
# `expect(true).toBe(true)`, checklist Fase 6 #46) — corregido: el
# script "test" de firebase/functions ahora se auto-contiene con
# `firebase emulators:exec` (levanta auth+firestore+functions, corre
# jest contra ellos de verdad, y los apaga solo), con tests reales de
# integración. firebase-tools quedó como devDependency del proyecto
# (antes esto dependía de una instalación global que solo existía en
# la máquina de desarrollo — no habría funcionado nunca en este CI).
name: Test

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # firebase/functions arranca el emulador de Firestore/Storage
      # (Java) via `firebase emulators:exec` — firebase-tools exige
      # JDK >=21 y el runner de GitHub no trae uno activo por defecto.
      - name: Setup Java (para los emuladores de Firestore/Storage)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Imprescindible antes de "test": firebase/functions importa
      # @monagas/core compilado (packages/core/dist/index.js), no su
      # código fuente — sin este paso, en un checkout nuevo ese dist/
      # no existe y firebase/functions falla con MODULE_NOT_FOUND al
      # cargar las funciones (visto en la primera ejecución real de
      # este workflow en GitHub Actions; en local "funcionaba" solo
      # porque ya había un dist/ de una compilación anterior).
      - name: Build
        run: pnpm build

      # Sin "-r" — mismo motivo que build.yml: el script "test" de la
      # raíz ya es "pnpm -r test", no hace falta (ni conviene)
      # duplicarlo aquí.
      - name: Run tests
        run: pnpm test
