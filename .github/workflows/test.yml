# Tests en cada push/PR.
#
# Historial real: nunca pasó, en ninguna de sus ejecuciones — mismo bug
# que build.yml (pnpm no se instalaba). Corregido con pnpm/action-setup.
#
# Aviso importante: aun con eso corregido, esta ejecución seguirá
# fallando hasta que se resuelva el checklist Fase 6, #46 —
# firebase/functions/jest.config.js apunta a un src/setupTests.ts que
# no existe y usa testEnvironment: 'jsdom' para un backend de Node. Eso
# es correcto que falle: es una señal real, no un bug del workflow.
name: Test

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sin "-r" — mismo motivo que build.yml: el script "test" de la
      # raíz ya es "pnpm -r test", no hace falta (ni conviene)
      # duplicarlo aquí.
      - name: Run tests
        run: pnpm test
